<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | Surfing Moments in Sri Lanka | SurfLocal</title>
    <meta name="description"
        content="See the smiles, the waves, and the good vibes. Our gallery of surf lessons and beautiful sunsets in Ahangama and Weligama.">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .gallery-item {
            position: relative;
            border-radius: var(--radius-sm);
            overflow: hidden;
            aspect-ratio: 1;
            background-color: #ddd;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: scale(1.02);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item:nth-child(2n) {
            aspect-ratio: 4/5;
            /* Varied Aspect Ratios for masonry feel */
            grid-row: span 2;
        }

        /* Lightbox Styles */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 2000;
            padding-top: 50px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .lightbox-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90vh;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            animation: zoom 0.3s;
        }

        @keyframes zoom {
            from {
                transform: scale(0)
            }

            to {
                transform: scale(1)
            }
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
    <link rel="stylesheet" href="css/whatsapp.css">
</head>

                <div class="gallery-item"><img src="assets/images/gallery_model_board.jpg" alt="Ready for the surf">

                <div class="gallery-item"><img src="assets/images/gallery_model_sunset.png"

                <div class="gallery-item"><img src="assets/images/gallery_upload_3.jpg" alt="Beautiful waves"></div>
                <div class="gallery-item"><img src="assets/images/gallery_upload_4.jpg" alt="Surf school vibe"></div>

                <!-- Keeping some placeholders for layout balance if needed, or removing them for a cleaner look. Let's keep a couple of colors for 'mood' -->

                <div class="gallery-item" style="background: #ffe0b2;"></div>
            </div>

            <div class="text-center" style="margin-top: 3rem;">
                <p>Follow us on Instagram <a href="#"
                        style="color:var(--color-primary); font-weight:700;">@SurfLocalSL</a> for daily reports!</p>
            </div>
        </div>
    </section>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <footer>
        <div class="container text-center">
            <p>&copy; 2024 SurfLocal Sri Lanka. Smile, Surf, Repeat.</p>
        </div>
    </footer>

    <script>
        const mobileToggle = document.getElementById('mobile-toggle');
        const navLinks = document.getElementById('nav-links');
        mobileToggle.addEventListener('click', () => navLinks.classList.toggle('active'));

        // Lightbox Logic
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const span = document.getElementsByClassName("close")[0];
        const images = document.querySelectorAll('.gallery-item img');

        images.forEach(img => {
            img.addEventListener('click', function () {
                lightbox.style.display = "flex";
                lightboxImg.src = this.src;
            });
        });

        // Close on X click
        span.onclick = function () {
            lightbox.style.display = "none";
        }

        // Close on background click
        lightbox.onclick = function (event) {
            if (event.target === lightbox) {
                lightbox.style.display = "none";
            }
        }
    </script>
